  - id: DIS-04
    title: "Post-fire recovery and regeneration-failure layer"
    workstream: DIS
    status: complete
    wave: 2
    sources:
      - ref: "Silva21 OB 1a, Regeneration after catastrophic disturbance"
        url: "https://www.silva21.com/projects/regeneration-after-catastophic-disturbance"
