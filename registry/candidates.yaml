  - id: DIS-02
    title: "NSR detection and attribution adapter"
    workstream: DIS
    status: deferred
    wave: 2
    sources:
      - ref: "Brown et al. 2025, NSR detection with Harmonized Landsat-Sentinel-2"
        url: "https://doi.org/10.1016/j.isprsjprs.2024.12.014"
      - ref: "Mulverhill et al. 2026, Forest condition and NSR in a continuous inventory context"
        url: "https://doi.org/10.1080/2150704X.2026.2683130"
      - ref: "Trotto et al. 2024, Bitemporal ALS and NSR"
        url: "https://doi.org/10.1016/j.srs.2024.100160"
    what: >-
      Convert HLS/NSR detections into shared disturbance events and attach them to
      fragments and stands for growth, risk, and silvicultural decisions.
    fresh_targets: [femic, ws4]
    integration: algorithm
    gap: >-
      FEMIC assumes stand-replacing harvest; partial mortality, defoliation, and
      drought stress are not represented in the estate model.
    inputs: "HLS time series; trained NSR model; validation labels; disturbance schema."
    dependencies: [DIS-01]
    effort: M
    impact: 4
    readiness: 4
    risk: 2
    first_step: >-
      Run the published NSR workflow on one AOI and emit `disturbance.v1` records for
      ws4 consumption.
    risks: >-
      Detection thresholds; attribution confusion; cloud and snow gaps.
    resolution: >-
      Implemented as the public UBC-FRESH/fresh-beast package (`0.1.0a1`) with an
      HLS -> NBR -> Rbeast BEAST -> `femic.disturbance.v1` path and FEMIC/WS4
      consumer tests. A 2019 TSA 23 AOS Aspen Leaf Miner (`ID6`, Moderate)
      case-control test (31 positive / 47 control blocks) failed at the 0.5
      threshold: sensitivity 25.8%, specificity 66.0%, precision 33.3%, and
      same-year 2019 detection 0/31. Operational use is therefore deferred; the
      package remains an exploratory overlay only. No objective, growth,
      constraint, or solver was changed.
