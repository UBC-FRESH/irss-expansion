    inputs: "Biomass curves; species; volume curves; carbon fraction assumptions."
    dependencies: []
    effort: M
    impact: 5
    readiness: 4
    risk: 2
    first_step: >-
      Add a biomass curve table and a carbon conversion report to one FEMIC instance.
    risks: >-
      Species-specific allometry; belowground omission; curve vintage.
    owner: >-
      UBC-FRESH/femic P117 (#374); no individual GitHub assignee is recorded on
      the live issue.
    unresolved_dependency: >-
      Parent P117 (#374) and child #376 remain open. The candidate still needs a
      published biomass curve selection and a declared carbon-fraction boundary
      before integration; P117.1 is still active on the shared phase branch.
    provenance: >-
      P3 selected this candidate as the first model-integration handoff after the
      2026-11-03 re-score. Live target confirmed: UBC-FRESH/femic P117 (#374,
      active) and P117.2 (#376, open), branch `feature/p117-efi-attributes` at
      `67cba53`. No implementation exists and no target issue was created or
