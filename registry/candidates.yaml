      Map post-fire recovery and regeneration failure, then encode regeneration status
      and failure risk as fragment attributes and scenario constraints.
    fresh_targets: [femic, ws4]
    integration: data-contract
    gap: >-
      Regeneration assumptions are static and optimistic; there is no way to prioritise
      remediation or adjust yield where regeneration has failed.
    inputs: "Landsat/HLS recovery metrics; ALS structure; field plots; fire perimeters."
    dependencies: [DIS-01]
    effort: M
    impact: 5
    readiness: 3
    risk: 2
    first_step: >-
      Ingest one published recovery/failure layer and add `regen_status` to a pilot
      FEMIC instance.
    risks: >-
      Recovery metrics are not survival; time lags; species-specific interpretation.
    resolution: >-
      Implemented in ws4 (PRs #499, #502, #503, #509): the NTEMS fire recovery
      layer is applied to all 102,128 TSA23 blocks. 1,497 blocks are not recovered
      (21,948 ha), 58 slower (745 ha). Deferring the 491 not-recovered blocks in
      the 20-year schedule reduces volume 0.069% (5 years) or 0.093% (10 years);
      the effect is too small to justify a hard constraint. Spectral recovery is
      not survival; no objective change.
