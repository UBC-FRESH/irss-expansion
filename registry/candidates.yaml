  - id: DEC-03
    title: "Provenance and uncertainty communication"
    workstream: DEC
    status: complete
    wave: 2
    sources:
      - ref: "ws4 provenance phases P32/P35"
        url: "https://github.com/UBC-FRESH/ws4"
      - ref: "Silva21 data management lessons (Extension Note Vol 14)"
        url: "https://www.silva21.com/extensionnotes?lang=en"
    what: >-
      Turn technical provenance into user-facing badges, source links, and uncertainty
      bands in reports and the web UI.
    fresh_targets: [cross]
    integration: ui
    gap: >-
      Provenance exists in manifests but is not legible to decision-makers.
    inputs: "Provenance records; uncertainty estimates; report templates."
    dependencies: [DATA-01, DEC-04]
    effort: M
    impact: 4
    readiness: 4
    risk: 1
    first_step: >-
      Add a provenance block and uncertainty band to one existing ws4 report.
    risks: >-
      Information overload; provenance gaps; false reassurance.
    resolution: >-
      Complete as UBC-FRESH/ws4 P108 (#734, PR #741, merge `00c0b6c`): the
      `ws4.report.provenance.v1` sidecar records report names, bytes, and SHA-256
      digests, source metadata and hashes, run and dataset identity, and an explicit
      `not_stated` uncertainty status when inputs carry no uncertainty metadata. The
      reports API exposes the sidecar and recorded digests, and the Reports tab shows
      a provenance badge with links to the sidecar and source metadata. The earlier
      condition-card uncertainty column and provenance block landed in P100 (#670,
      PR #690, `d14f4ff`). Uncertainty bands beyond `not_stated` remain absent
      because the inputs do not state them.
