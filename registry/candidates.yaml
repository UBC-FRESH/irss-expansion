  - id: DATA-06
    title: "Uncertainty-aware optimization"
    workstream: DATA
    status: candidate
    wave: 3
    sources:
      - ref: "ws4 optimization and Nemora uncertainty"
        url: "https://github.com/UBC-FRESH/ws4"
    what: >-
      Prototype robust or chance-constrained optimization so plans remain feasible
      under yield, price, and disturbance uncertainty.
    fresh_targets: [ws4]
    integration: model
    gap: >-
      ws4 assumes deterministic yields and prices; a plan that is optimal on the mean
      can be fragile.
    inputs: "Uncertainty distributions; scenario tree; solver support."
    dependencies: [DATA-01, GRO-03]
    effort: L
    impact: 5
    readiness: 2
    risk: 4
    first_step: >-
      Run a small robust reformulation on an existing instance and compare the cost of
      robustness.
    risks: >-
      Solver tractability; scenario explosion; interpretation and adoption.
