meta:
  project: "IRSS x Silva21 Expansion Mine for the FRESH forest modelling ecosystem"
  version: "0.1"
  generated: "2026-10-25"
  last_audited: "2026-11-03"
  audit_note: "notes/17-p2-contract-audit.md; notes/20-p3-model-integration-rescore.md; notes/22-p4-candidate-reconciliation.md; notes/25-p6-maintenance-plan.md; notes/26-p6-first-review.md"
  scope: >-
    Candidate projects, algorithms, data products, and technologies mined from the UBC
    Integrated Remote Sensing Studio (IRSS) and the Silva21 research program, screened
    for integration into FEMIC, ws3, ws4, FHOPS, and Nemora.
  scoring:
    formula: "priority = (impact * readiness) / (effort_points * risk)"
    effort_points:
      S: 1
      M: 2
      L: 3
      XL: 5
    interpretation: >-
      Higher is better. Impact and readiness are 1-5; risk is 1-5 (higher is riskier).
      The score is a screening aid, not an approval. Wave assignment and dependencies
      override the raw score.
  status_values:
    - queued
    - shortlisted
    - candidate
    - adopted
    - complete
    - deferred
    - rejected
  target_values:
    - femic
    - ws3
    - ws4
    - fhops
    - nemora
    - cross
  workstreams:
    INV: "Inventory, LiDAR, and enhanced forest inventory"
    GRO: "Growth, yield, climate response, and productivity"
    DIS: "Disturbance, risk, and recovery"
    PLAN: "Landscape planning and resilience"
    CARB: "Carbon and biomass accounting"
    BIO: "Biodiversity and habitat"
    OPS: "Harvesting operations, thinning, and salvage"
    DATA: "Data engineering, uncertainty, and synthetic forests"
    DEC: "Decision support, provenance, and validation"
candidates:
  - id: INV-01
    title: "ALS area-based inventory imputation contract"
    workstream: INV
    status: complete
    wave: 2
    sources:
      - ref: "IRSS LiDAR research theme"
        url: "https://irsslab.forestry.ubc.ca/research/lidar/"
      - ref: "Coops et al. 2021, Modelling lidar-derived estimates of forest attributes over space and time"
        url: "https://doi.org/10.1016/j.rse.2021.112477"
      - ref: "Silva21 OB 4a, LiDAR EFI for growth projections"
        url: "https://www.silva21.com/projects/lidar-efi-for-growth-projections%3A-new-approaches"
    what: >-
      Turn FEMIC's existing LiDAR product bundle (CHM, canopy structure, tree
      products) into area-based inventory attributes (height, volume, basal area,
      density, species fractions, canopy cover) with model metadata and
      per-attribute uncertainty.
    fresh_targets: [femic, nemora]
    integration: data-contract
    gap: >-
      FEMIC owns the open LiDAR source, materialization, terrain, canopy, tree, and
      bundle pipeline, but it stops at canopy and tree products. It does not fit or
      apply area-based models for inventory attributes, and it does not carry
      per-attribute error into curve selection.
    inputs: "FEMIC LiDAR bundle; ABA model; plot calibration data; model card."
    dependencies: [DEC-04, DATA-01]
    effort: M
    impact: 5
    readiness: 4
    risk: 3
    first_step: >-
      Define an `inventory.als` model-card table (fragment_id, attribute, value,
      model_id, rmse) and a reader that applies a fitted ABA model to one FEMIC
      LiDAR bundle; use the ws4 P48/P49 plot reconciliation as the validation lane.
    risks: >-
      Model transferability across BEC zones and acquisition conditions; ALS data
      licensing; double-counting when conventional inventory is also present.
    resolution: >-
      Completed through UBC-FRESH/femic P120-P122: inventory.als contract, published BA-only pilot (2,942,755 rows/pixels, 14.9% TSA coverage), strict BA RMSE 8.86 m2/ha, 36 in-range plots. Height failed independent validation; volume remains research-only. See notes/reports/inv01-tsa23-ba-pilot-release.md and .acceptance.md.
  - id: INV-02
    title: "Tree-list and stem-distribution metrics from high-density LiDAR"
    workstream: INV
    status: candidate
    wave: 3
    sources:
      - ref: "Silva21 OB 4b, LiDAR stem metrics for tree-list models"
        url: "https://www.silva21.com/projects/lidar-stem-metrics-for-tree-list-models"
      - ref: "Irwin et al. 2024, Prioritizing commercial thinning with high-density drone laser scanning"
        url: "https://doi.org/10.1093/forestry/cpae030"
      - ref: "Qi et al. 2022, Comparing tree attributes from quantitative structure models"
        url: "https://doi.org/10.1016/j.isprsjprs.2022.07.021"
    what: >-
      Derive DBH distributions, stem maps, and competition metrics from high-density
      drone or mobile LiDAR for input to tree-list models and complex mixedwood stands.
    fresh_targets: [femic, nemora]
    integration: algorithm
    gap: >-
      FEMIC curves are stand-level; there is no tree-list lane and no way to represent
      complex, multi-cohort structure in the estate model.
    inputs: "High-density point clouds; tree segmentation/QSM pipeline; species labels."
    dependencies: [INV-01, INV-07]
    effort: L
    impact: 4
    readiness: 2
    risk: 3
    first_step: >-
      Prototype a DBH-distribution export on one dense stand and compare predicted
      volume against the current TIPSY/VDYP curve.
    risks: >-
      QSM accuracy in dense canopies; species attribution; small sample of operational
      acquisitions.
  - id: INV-03
    title: "Multi-temporal ALS harmonization and periodic annual increment"
    workstream: INV
    status: candidate
    wave: 3
    sources:
      - ref: "Riofrio et al. 2022, Harmonizing multi-temporal ALS to derive periodic annual height increments"
        url: "https://doi.org/10.1139/cjfr-2022-0055"
      - ref: "Riofrio et al. 2023, Modelling height growth with multi-temporal ALS"
        url: "https://doi.org/10.1016/j.foreco.2023.121137"
    what: >-
      Harmonize repeat ALS acquisitions and derive height and structure increments as
      an independent check on yield curves and a calibration source for growth models.
    fresh_targets: [femic, ws4]
    integration: algorithm
    gap: >-
      FEMIC curves are calibrated to provincial PSPs and TIPSY/VDYP; repeat-LiDAR
      evidence is not part of the curve validation loop.
    inputs: "Two or more ALS epochs; ground control; existing curve families."
    dependencies: [INV-01, DEC-04]
    effort: L
    impact: 4
    readiness: 3
    risk: 3
    first_step: >-
      Run a two-epoch pilot in one TSA and compare height increment with VDYP/TIPSY
      predictions at the same locations.
    risks: >-
      Registration and timing differences between flights; phenology; changes in
      acquisition specifications.
  - id: INV-04
    title: "Site index and potential height from ALS"
    workstream: INV
    status: rejected
    wave: 1
    sources:
      - ref: "Tompalski et al. 2022, Modeling site index of selected poplar clones using ALS"
        url: "https://doi.org/10.1139/cjfr-2021-0257"
      - ref: "Gavilan-Acuna et al. 2022, Estimating potential tree height in Pinus radiata plantations using ALS"
        url: "https://doi.org/10.1139/cjfr-2022-0121"
      - ref: "IRSS growth and productivity publications"
        url: "https://irsslab.forestry.ubc.ca/publications/"
    what: >-
      Produce a spatially explicit site-index or potential-height layer from ALS and
      use it to select or adjust FEMIC yield curves at fragment resolution.
    fresh_targets: [femic]
    integration: algorithm
    gap: >-
      Site index is carried at AU/stratum resolution and is often inherited from
      inventory; ALS offers a repeatable, wall-to-wall alternative.
    inputs: "ALS canopy metrics; species; existing SI curves; plot data for validation."
    dependencies: []
    effort: M
    impact: 4
    readiness: 4
    risk: 2
    first_step: >-
      Add an optional `si_als` field with provenance and backtest it against the
      current TSA 48 or K3Z SI assignment, using the ws4 P48/P49 ground-plot
      validation surfaces where they apply.
    risks: >-
      Species-specific SI equations; young-stand height not equal to site height;
      overfitting to one BEC zone.
    resolution: >-
      Rejected as a modelling task. British Columbia already has full SI
      coverage through VRI polygons, VDYP outputs, and SIBEC BEC/site-series
      estimates. Deriving a new general ALS SI model is remote-sensing research,
      not software integration. The generic `femic.efi.application` engine
      remains available for an existing model card; no SI model work is queued.
      Origin: synthesized from two plantation-specific IRSS papers, not an
      IRSS/Silva21 project deliverable.

  - id: INV-05
    title: "Species composition and mixedwood fraction layers"
    workstream: INV
    status: complete
    wave: 2
    sources:
      - ref: "Hermosilla et al. 2022, Mapping tree species in Canada's forested ecosystems"
        url: "https://doi.org/10.1016/j.rse.2022.113276"
      - ref: "Queinnec et al. 2023, Mapping dominant boreal tree species groups with ALS and Sentinel-2"
        url: "https://doi.org/10.1080/07038992.2022.2130742"
    what: >-
      Consume national or regional species-composition layers and store species
      fractions as fragment attributes that can drive curve selection and product
      eligibility.
    fresh_targets: [femic, ws4]
    integration: data-contract
    gap: >-
      FEMIC uses coarse species/AU labels; mixedwood composition is poorly represented
      and cannot flow into product or habitat accounts.
    inputs: "Species rasters or stand tables; BEC/AU linkage; validation plots."
    dependencies: [DEC-04]
    effort: M
    impact: 4
    readiness: 4
    risk: 2
    first_step: >-
      Define a species-fraction schema and ingest one public Canada-wide layer into a
      pilot FEMIC instance.
    risks: >-
      Class confusion in mixedwoods; temporal mismatch with the inventory vintage;
      species labels not aligned with TIPSY/VDYP species codes.
    resolution: >-
      Implemented in UBC-FRESH/ws4 PRs #490 and #492. The NTEMS 2022 dominant
      layer and VRI species percentages are ingested into separate composition
      and fraction contracts. TFL 6 leading species agree on 4/6 comparable
      blocks; all six labelled VRI blocks are mixed (non-leading fraction
      0.40-0.60). A dominant-species product cannot supply the mixedwood
      fraction, so VRI/ALS is the fraction source.
  - id: INV-06
    title: "Structurally guided sampling with sgsR"
    workstream: INV
    status: complete
    wave: 1
    sources:
      - ref: "Goodbody et al. 2023, sgsR: a structurally guided sampling toolbox"
        url: "https://doi.org/10.1093/forestry/cpac055"
      - ref: "Silva21 OB 5a, Continuous forest inventory framework"
        url: "https://www.silva21.com/projects/continuous-forest-inventory-framework"
    what: >-
      Add structurally guided sampling design and validation to Nemora/FEMIC so
      inventory plots and LiDAR calibration are allocated against structure rather
      than a uniform grid.
    fresh_targets: [nemora, femic]
    integration: packaging
    gap: >-
      Sampling design and inventory QA are ad hoc; there is no shared tool for
      allocating plots or testing whether an ALS model covers the structural range.
    inputs: "ALS structure metrics; existing plot networks; sgsR algorithm or R bridge."
    dependencies: []
    effort: S
    impact: 3
    readiness: 5
    risk: 1
    first_step: >-
      Wrap or port the sgsR sampling workflow into `nemora.sampling` with a CLI and a
      small worked example.
    risks: >-
      R/Python bridge maintenance; licensing of the original implementation; user
      confusion between sampling design and model validation.
    resolution: >-
      Created as UBC-FRESH/nemora#10, child of P5 (#7). Merged in
      UBC-FRESH/nemora#14 as `2e8776c`; the optional sgsR R bridge and worked
      example are in the Nemora sampling surface.
    provenance: >-
      Live audit 2026-11-03: UBC-FRESH/nemora#10 is closed, PR #14 is merged as
      `2e8776c`, and parent P5 (#7) is closed. See notes/17-p2-contract-audit.md.
  - id: INV-07
    title: "Drone and mobile LiDAR pilot ingestion"
    workstream: INV
    status: candidate
    wave: 3
    sources:
      - ref: "Silva21 OB 2, Advanced RS from free-to-grow to thinning"
        url: "https://www.silva21.com/projects/advanced-rs%3A-free-to-grow-to-thinning-stage"
      - ref: "Silva21 OB 6, New technologies for measurements within stands"
        url: "https://www.silva21.com/projects/new-technologies-for-measurements-within-stands"
      - ref: "Olson et al. 2025, Drone-based intra-canopy photogrammetry"
        url: "https://doi.org/10.1016/j.compag.2025.110200"
    what: >-
      Define a plot-level point-cloud product and ingest drone/mobile LiDAR or
      photogrammetry for regeneration, thinning, and tree-health assessments.
    fresh_targets: [femic, fhops]
    integration: data-contract
    gap: >-
      There is no sub-stand data path for treatment prescriptions; FEMIC and FHOPS
      operate at stand or block resolution.
    inputs: "Drone/mobile point clouds; ground control; plot metadata."
    dependencies: []
    effort: L
    impact: 3
    readiness: 3
    risk: 3
    first_step: >-
      Publish a minimal plot-product contract and test it on one existing Silva21
      drone acquisition.
    risks: >-
      Data volume and processing cost; regulatory constraints; proprietary formats;
      unclear operational cadence.
  - id: INV-08
    title: "LiDAR structural change detection"
    workstream: INV
    status: candidate
    wave: 3
    sources:
      - ref: "Marinelli et al. 2022, Forest change detection in LiDAR using polar change vector analysis"
        url: "https://doi.org/10.1109/LGRS.2020.3022282"
      - ref: "Trotto et al. 2024, Bitemporal ALS and non-stand-replacing disturbance"
        url: "https://doi.org/10.1016/j.srs.2024.100160"
    what: >-
      Detect structural change between LiDAR epochs and emit change polygons with
      magnitude and direction, complementing optical change detection.
    fresh_targets: [femic, ws4]
    integration: algorithm
    gap: >-
      Change detection in the ecosystem is optical and land-cover oriented; structural
      degradation and partial mortality are invisible.
    inputs: "Repeat ALS point clouds; co-registration; threshold calibration."
    dependencies: [INV-03, DIS-01]
    effort: M
    impact: 3
    readiness: 3
    risk: 2
    first_step: >-
      Run the polar change-vector method on one two-epoch pilot and compare with HLS
      NSR detections.
    risks: >-
      False positives from acquisition differences; sparse repeat coverage; method
      maturity.
  - id: INV-09
    title: "Road extraction and status from ALS"
    workstream: INV
    status: shortlisted
    wave: 2
    sources:
      - ref: "Roussel et al. 2022, Correction and enhancement of forestry road maps using ALS"
        url: "https://doi.org/10.1016/j.jag.2022.103020"
      - ref: "IRSS road and access publications"
        url: "https://irsslab.forestry.ubc.ca/publications/"
    what: >-
      Derive or refresh road centerlines, surface condition, and access status from
      ALS, and feed a shared road-status layer to ws4 and FHOPS.
    fresh_targets: [ws4, fhops]
    integration: data-contract
    gap: >-
      ws4 builds and costs roads from a supplied network; FHOPS assumes access.
      Neither ingests remotely sensed road condition.
    inputs: "ALS point clouds; existing road vectors; status observations."
    dependencies: [DEC-04]
    effort: M
    impact: 4
    readiness: 4
    risk: 2
    first_step: >-
      Define `road.status` (segment_id, status, surface, passability, source, date)
      and import one ALS-derived centerline set into ws4.
    risks: >-
      Centerline attribution errors; status classification ambiguity; integration with
      existing road-network topology.
  - id: INV-10
    title: "Genetic gain and seedlot performance from ALS"
    workstream: INV
    status: candidate
    wave: 3
    sources:
      - ref: "du Toit et al. 2022, Generating Douglas-fir breeding value estimates using ALS"
        url: "https://doi.org/10.3389/fpls.2022.893017"
      - ref: "du Toit et al. 2021, Internal crown geometric features from ALS in a realized-gain trial"
        url: "https://doi.org/10.1093/forestry/cpaa046"
      - ref: "IRSS tree improvement and realized-gain publications"
        url: "https://irsslab.forestry.ubc.ca/publications/"
    what: >-
      Estimate realized genetic gain and seedlot performance from ALS height and crown
      metrics in realized-gain trials, and use it to adjust plantation yield
      assumptions.
    fresh_targets: [femic, ws4]
    integration: algorithm
    gap: >-
      FEMIC and TIPSY plantation curves assume a generic genetic gain; there is no
      link from a seedlot or trial to the curve, and no provenance for the assumption.
    inputs: "ALS metrics; realized-gain trial design; seedlot metadata; yield curves."
    dependencies: [INV-01, INV-04]
    effort: M
    impact: 3
    readiness: 3
    risk: 3
    first_step: >-
      Reproduce a published breeding-value or gain estimate on one trial and compare it
      with the default TIPSY gain assumption.
    risks: >-
      Trial representativeness; genotype-by-environment interaction; small sample;
      proprietary seedlot data.
  - id: GRO-01
    title: "Climate data contract and GCM ensemble"
    workstream: GRO
    status: complete
    wave: 1
    sources:
      - ref: "Silva21 climate data and SilvR21"
        url: "https://www.silva21.com/climatedata?lang=en"
      - ref: "Wotherspoon et al. 2022, Climate Scenarios for Canadian Forests"
        url: "https://www.silva21.com/climatedata?lang=en"
      - ref: "Wotherspoon et al. 2023, Future climate trends across Canadian ecozones"
        url: "https://doi.org/10.1139/cjfr-2023-0058"
    what: >-
      Define a canonical climate table (variable, year, scenario, GCM, value, source,
      downscaling method) and an adapter for ClimateNA/SilvR21 outputs.
    fresh_targets: [cross]
    integration: data-contract
    gap: >-
      Climate is used ad hoc, if at all; there is no provenance-bearing climate layer
      shared by FEMIC, ws4, and Nemora.
    inputs: "ClimateNA/SilvR21 outputs; GCM ensemble; DEM; hub or AOI polygons."
    dependencies: []
    effort: S
    impact: 5
    readiness: 5
    risk: 1
    first_step: >-
      Publish `climate.v1` with a JSON schema, a small sample for one AOI, and a
      reader in FEMIC or Nemora.
    risks: >-
      Scenario/GCM proliferation; licensing terms for ClimateNA; downscaling
      differences between providers.
    risks: >-
      Scenario/GCM proliferation; licensing terms for ClimateNA; downscaling
      differences between providers.
    resolution: >-
      Created as UBC-FRESH/femic#370, child of P116 (#369). Merged in
      UBC-FRESH/femic#378 as `9e16be9`.
    provenance: >-
      Live audit 2026-11-03: UBC-FRESH/femic#370 is closed and PR #378 is merged
      as `9e16be9`. See notes/17-p2-contract-audit.md.

  - id: GRO-02
    title: "Climate-adjusted yield curve modifiers"
    workstream: GRO
    status: shortlisted
    wave: 2
    sources:
      - ref: "Silva21 AN 3a, Integration of climate drivers into growth modelling"
        url: "https://www.silva21.com/projects/integration-of-climate-drivers-into-growth-modelling-(an3a)"
      - ref: "Silva21 AN 3b, Integration of climate drivers into growth modelling"
        url: "https://www.silva21.com/projects/integration-of-climate-drivers-into-growth-modelling-(an3b)"
      - ref: "Wotherspoon et al. 2023, Future climate trends"
        url: "https://doi.org/10.1139/cjfr-2023-0058"
    what: >-
      Implement a modifier API that adjusts VDYP/TIPSY-style yield curves for climate
      covariates while preserving the original curve and recording the modifier
      version.
    fresh_targets: [femic, ws4]
    integration: model
    gap: >-
      FEMIC curves are static; ws4 has no way to represent climate-driven productivity
      change inside a scenario.
    inputs: "Climate table; species/BEC response functions; curve families."
    dependencies: [GRO-01, DATA-01]
    effort: L
    impact: 5
    readiness: 4
    risk: 3
    first_step: >-
      Implement one published response function for one species/BEC and compare
      scenario output against the unmodified curve.
    risks: >-
      Extrapolation beyond calibration range; double-counting site index and climate;
      weak evidence for some species.
  - id: GRO-03
    title: "Climate-sensitive mortality transitions"
    workstream: GRO
    status: shortlisted
    wave: 2
    sources:
      - ref: "Fortin et al. 2024, Climate-sensitive models of tree mortality"
        url: "https://doi.org/10.1139/cjfr-2024-0205"
      - ref: "Silva21 OB 7, Climate-sensitive growth modelling in Ontario"
        url: "https://www.silva21.com/projects/climate-sensitive-growth-modelling-in-ontario"
    what: >-
      Add annual or periodic stand-level mortality probability as a model transition,
      driven by climate, age, density, and disturbance history.
    fresh_targets: [femic, ws4]
    integration: model
    gap: >-
      FEMIC has no mortality transition; ws4 assumes scheduled harvest or natural
      stand development, not climate-driven loss.
    inputs: "PSP remeasurements; climate table; species and stand attributes."
    dependencies: [GRO-01, DIS-01]
    effort: L
    impact: 5
    readiness: 4
    risk: 3
    first_step: >-
      Implement a published mortality function as a transition and validate predicted
      losses against a held-out PSP set.
    risks: >-
      Rare-event calibration; confounding with disturbance; transferability across
      ecosystems.
  - id: GRO-04
    title: "Stand-level model fusion"
    workstream: GRO
    status: candidate
    wave: 3
    sources:
      - ref: "Johnson et al. 2026, Modifying stand-level growth under a changing climate using model fusion"
        url: "https://doi.org/10.1007/s44391-025-00053-5"
    what: >-
      Prototype a fusion layer that combines empirical yield curves, process-model
      output, and remote-sensing growth evidence into a single stand-level projection
      with explicit weights.
    fresh_targets: [femic, nemora]
    integration: algorithm
    gap: >-
      The ecosystem has separate empirical and process lanes but no principled way to
      combine them or carry the disagreement forward.
    inputs: "Curve predictions; 3-PG or other process output; ALS/Landsat increments."
    dependencies: [GRO-02, GRO-03, GRO-09]
    effort: L
    impact: 4
    readiness: 2
    risk: 4
    first_step: >-
      Reimplement the published fusion method on one species and compare against each
      component model.
    risks: >-
      Method complexity; correlated errors; unclear uncertainty propagation; new
      publication with limited replication.
  - id: GRO-05
    title: "Age-independent height-growth trajectories"
    workstream: GRO
    status: candidate
    wave: 2
    sources:
      - ref: "Riofrio et al. 2023, Age-independent height growth from multi-temporal ALS"
        url: "https://doi.org/10.1016/j.foreco.2023.121137"
    what: >-
      Use repeat ALS to estimate height-growth trajectories without relying on stand
      age, improving curve selection in mixedwood and uneven-aged stands.
    fresh_targets: [femic]
    integration: algorithm
    gap: >-
      FEMIC curve selection depends on age, which is unreliable in mixedwoods and
      partially harvested stands.
    inputs: "Repeat ALS; species; site index; existing curves."
    dependencies: [INV-03]
    effort: M
    impact: 3
    readiness: 3
    risk: 3
    first_step: >-
      Derive trajectories for a pilot and test whether they select a different curve
      family than the current age-based rule.
    risks: >-
      Short observation windows; disturbance contamination; limited species coverage.
  - id: GRO-06
    title: "Biomass yield curves from time-series remote sensing"
    workstream: GRO
    status: queued
    wave: 1
    sources:
      - ref: "Tompalski et al. 2024, Developing aboveground biomass yield curves from time-series remote sensing"
        url: "https://doi.org/10.1016/j.foreco.2024.121894"
      - ref: "IRSS carbon and biomass publications"
        url: "https://irsslab.forestry.ubc.ca/research/carbon/"
    what: >-
      Add biomass and carbon curve families derived from Landsat time series and
